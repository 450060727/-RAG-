name: rag-project

services:
  backend-admin:
      command:
        - java
        - -jar
        - app.jar
      container_name: rag-backend-admin
      env_file: .env
      environment:
        SPRING_PROFILES_ACTIVE: prod
        TZ: Asia/Shanghai
        SERVER_PORT: 8081
        REDIS_HOST: redis
        SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
        SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
        SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      image: eclipse-temurin:23-jre-alpine
      networks:
        rag-network:
      ports:
        - "8081:8081"
      restart: always
      volumes:
        - ./backend-admin/app.jar:/app/app.jar
      working_dir: /app

    backend-front:
      command:
        - java
        - -jar
        - app.jar
      container_name: rag-backend-front
      env_file: .env
      environment:
        SPRING_PROFILES_ACTIVE: prod
        TZ: Asia/Shanghai
        SERVER_PORT: 8082
        REDIS_HOST: redis
        SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
        SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
        SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      image: eclipse-temurin:23-jre-alpine
      networks:
        rag-network:
      ports:
        - "8082:8082"
      restart: always
      volumes:
        - ./backend-front/app.jar:/app/app.jar
      working_dir: /app

    mysql:
      command:
        - --character-set-server=utf8mb4
        - --collation-server=utf8mb4_unicode_ci
      container_name: rag-mysql
      env_file: .env
      environment:
        TZ: Asia/Shanghai
      image: mysql:8.0
      networks:
        rag-network:
      ports:
        - "3306:3306"
      restart: always
      volumes:
        - ./data/mysql:/var/lib/mysql

    redis:
      command: redis-server --requirepass ${REDIS_PASSWORD}
      container_name: rag-redis
      env_file: .env
      image: redis:7-alpine
      networks:
        rag-network:
      ports:
        - "6379:6379"
      restart: always
      volumes:
        - ./data/redis:/data

    milvus:
      container_name: rag-milvus
      env_file: .env
      environment:
        TZ: Asia/Shanghai
      image: milvusdb/milvus:v2.4.10
      networks:
        rag-network:
      ports:
        - "19530:19530"
      restart: always
      volumes:
        - ./data/milvus:/var/lib/milvus

    ollama:
      container_name: rag-ollama
      env_file: .env
      deploy:
        resources:
          reservations:
            memory: "8589934592"
      image: ollama/ollama:latest
      networks:
        rag-network:
      ports:
        - "11434:11434"
      restart: always
      volumes:
        - ./data/ollama:/root/.ollama
      environment:
        OLLAMA_NUM_PARALLEL: 2
        OLLAMA_MAX_LOADED_MODELS: 3

    nginx:
      container_name: rag-nginx
      env_file: .env
      depends_on:
        - backend-admin
        - backend-front
      image: nginx:alpine
      networks:
        rag-network:
      ports:
        - "80:80"
        - "81:81"
      restart: always
      volumes:
        - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
        - ./frontend-admin/dist:/usr/share/frontend-admin
        - ./frontend-front/dist:/usr/share/frontend-front
        - ./nginx/logs:/var/log/nginx

  networks:
    rag-network:
      driver: bridge