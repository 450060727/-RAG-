worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Docker 内置 DNS，供变量形式的 proxy_pass 动态解析后端服务名
    resolver 127.0.0.11 valid=30s;

    # 通用代理请求头
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ========== 管理后台 81端口 ==========
    server {
        listen       81;
        server_name  localhost;
        # index.html 实际在挂载目录的 dist/ 子目录下
        root   /usr/share/frontend-admin/dist;
        index  index.html;

        # API 请求转发到 admin 后端（使用变量延迟解析，避免后端未启动时 nginx 起不来）
        location /api {
            set $backend_admin backend-admin;
            proxy_pass http://$backend_admin:8081;
        }

        # 前端路由统一走 index.html（SPA）
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ========== 用户端 80端口 ==========
    server {
        listen       80;
        server_name  localhost;
        # index.html 实际在挂载目录的 h5/ 子目录下
        root   /usr/share/frontend-front/h5;
        index  index.html;

        # API 请求转发到 front 后端（使用变量延迟解析，避免后端未启动时 nginx 起不来）
        location /api {
            set $backend_front backend-front;
            proxy_pass http://$backend_front:8082;
        }

        # 前端路由统一走 index.html（SPA）
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}